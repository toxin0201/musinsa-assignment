spring.application.name=point

# 잠금 대기 상한(3초)은 H2 URL 에서 잡는다. 초과하면 409 로 바꿔 응답한다.
spring.datasource.url=jdbc:h2:mem:point;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=3000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL 은 schema.sql 이 유일한 출처다. Hibernate 는 매핑이 맞는지 검증만 한다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 시각은 항상 UTC 로 저장해 조회 결과가 실행 환경의 시간대에 흔들리지 않게 한다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 금액과 일수는 정수다. 소수를 잘라 담거나 따옴표에 싼 숫자를 숫자로 바꿔 받으면
# 보낸 쪽이 적은 값과 다른 금액이 처리되므로, 본문을 읽어 들이는 자리에서 거절한다.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# 이 로거는 예외를 던지기 직전에 같은 내용을 ERROR 로 한 번 더 찍는다. 예외 자체는 그대로 전파되므로
# 정말 처리하지 못한 요청은 GlobalExceptionHandler 가 원인까지 담아 ERROR 로 남긴다. 여기서는 끈다 —
# 같은 회원의 첫 요청이 겹쳐 계정 유일 제약에 걸리는 정상 경합까지 ERROR 로 쌓이기 때문이다.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

point.earn.min-amount=1
point.earn.max-amount=100000
point.balance.default-max=1000000
point.expiry.default-days=365
point.expiry.min-days=1
point.expiry.max-years=5
